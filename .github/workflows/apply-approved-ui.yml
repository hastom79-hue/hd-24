name: Apply approved HD-24 UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply approved UI references') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject approved UI assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changed=False
          if 'hd24-ui-v3.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="./hd24-ui-v3.css?v=3">\n</head>')
              changed=True
          if 'hd24-ui-v3.js' not in s:
              s=s.replace('</body>','<script src="./hd24-ui-v3.js?v=3"></script>\n</body>')
              changed=True
          if changed:p.write_text(s,encoding='utf-8')
          PY
      - name: Commit approved UI references
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: apply approved UI references"
          git push