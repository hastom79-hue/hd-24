<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD-24 Runtime Refresh</title></head><body><p id="s">HD-24 최신 실행 파일을 강제로 새로 불러오는 중입니다.</p><script>(async()=>{const s=document.getElementById('s');try{if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}const stamp=Date.now();for(const u of ['./hd24-ui-v3.css?v=29','./hd24-ui-v3.js?v=29','./safe-kpi-mapping.js?v=21','./hd24-auto-run.js?v=27','./hd24-pipeline-gate.js?v=22','./hd24-followup.js?v=35','./hd24-direct-reply-guard.js?v=2','./hd24-reply-import-dedupe.js?v=1','./hd24-history-view.js?v=23','./mapping_india.json','./mapping_brazil.json']){const sep=u.includes('?')?'&':'?';const r=await fetch(u+sep+'hotfix='+stamp,{cache:'reload'});if(!r.ok)throw new Error(u+' HTTP '+r.status)}s.textContent='최신 실행 파일 반영 완료. HD-24로 이동합니다.';setTimeout(()=>location.replace('./?runtime_refresh='+stamp),250)}catch(e){s.textContent='새로고침 실패: '+(e&&e.message||e);}})();</script></body></html>
