name: Apply approved HD-24 UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply approved UI references') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending v16 real-file hardening
        run: python .github/scripts/patch_v16_realfile.py
      - name: Inject and align approved UI assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          ui=Path('hd24-ui-v3.js').read_text(encoding='utf-8')
          m=re.search(r"safe-kpi-mapping\.js\?v=(\d+)",ui)
          if not m:
              raise SystemExit('Cannot determine current HD24 runtime cache version from hd24-ui-v3.js')
          ver=m.group(1)
          original=s
          if 'hd24-ui-v3.css' not in s:
              s=s.replace('</head>',f'<link rel="stylesheet" href="./hd24-ui-v3.css?v={ver}">\n</head>')
          else:
              s=re.sub(r'hd24-ui-v3\.css\?v=\d+',f'hd24-ui-v3.css?v={ver}',s)
          if 'hd24-ui-v3.js' not in s:
              s=s.replace('</body>',f'<script src="./hd24-ui-v3.js?v={ver}"></script>\n</body>')
          else:
              s=re.sub(r'hd24-ui-v3\.js\?v=\d+',f'hd24-ui-v3.js?v={ver}',s)
          changed=s!=original
          if changed:
              p.write_text(s,encoding='utf-8')
          assert f'hd24-ui-v3.css?v={ver}' in s
          assert f'hd24-ui-v3.js?v={ver}' in s
          print(f'Approved UI version alignment: v{ver}; changed={changed}')
          PY
      - name: Verify no stale v3 reinjection logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('.github/workflows/apply-approved-ui.yml').read_text(encoding='utf-8')
          safe=Path('safe-kpi-mapping.js').read_text(encoding='utf-8')
          brazil=json.loads(Path('mapping_brazil.json').read_text(encoding='utf-8'))
          stale_js='hd24-ui-v3.js?v='+'3'
          stale_css='hd24-ui-v3.css?v='+'3'
          assert stale_js not in s
          assert stale_css not in s
          assert 'safe-kpi-mapping' in s and 'ver=m.group(1)' in s
          assert 'Cannot determine current HD24 runtime cache version' in s
          assert "re.sub(r'hd24-ui-v3\\.css\\?v=\\d+'" in s
          assert "re.sub(r'hd24-ui-v3\\.js\\?v=\\d+'" in s
          assert '안전 실적 반영 v16 시작' in safe
          assert '총괄 미래월 기존값' in safe
          ltir=[m for m in brazil if m.get('kpiEn')=='LTIR (Lost Time Incident Rate)']
          assert len(ltir)==1 and ltir[0]['unit']=='%'
          print('V16 + STALE CACHE GATE PASS')
          PY
      - name: Commit approved UI and v16 runtime references
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html safe-kpi-mapping.js hd24-ui-v3.js mapping_brazil.json .github/workflows/hd24-runtime-regression.yml .github/workflows/hd24-browser-e2e.yml .github/workflows/hd24-browser-e2e-brazil.yml
          git commit -m "feat: apply approved UI references and v16 runtime hardening"
          git push
