name: Apply approved HD-24 UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply approved UI references') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject and align approved UI assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # The old safe KPI mapping loader left the production chain in 5976600c.
          # Derive the outer UI cache version from the currently deployed index instead.
          m=re.search(r"hd24-ui-v3\.js\?v=(\d+)",s)
          if not m:
              raise SystemExit('Cannot determine current HD24 outer UI cache version from index.html')
          js_ver=m.group(1)
          cm=re.search(r"hd24-ui-v3\.css\?v=(\d+)",s)
          css_ver=cm.group(1) if cm else js_ver
          original=s
          if 'hd24-ui-v3.css' not in s:
              s=s.replace('</head>',f'<link rel="stylesheet" href="./hd24-ui-v3.css?v={css_ver}">\n</head>')
          else:
              s=re.sub(r'hd24-ui-v3\.css\?v=\d+',f'hd24-ui-v3.css?v={css_ver}',s)
          if 'hd24-ui-v3.js' not in s:
              s=s.replace('</body>',f'<script src="./hd24-ui-v3.js?v={js_ver}"></script>\n</body>')
          else:
              s=re.sub(r'hd24-ui-v3\.js\?v=\d+',f'hd24-ui-v3.js?v={js_ver}',s)
          changed=s!=original
          if changed:
              p.write_text(s,encoding='utf-8')
          assert f'hd24-ui-v3.css?v={css_ver}' in s
          assert f'hd24-ui-v3.js?v={js_ver}' in s

          rp=Path('refresh-runtime.html')
          rs=rp.read_text(encoding='utf-8')
          r0=rs
          rs=re.sub(r'hd24-ui-v3\.css\?v=\d+',f'hd24-ui-v3.css?v={css_ver}',rs)
          rs=re.sub(r'hd24-ui-v3\.js\?v=\d+',f'hd24-ui-v3.js?v={js_ver}',rs)
          if rs!=r0:
              rp.write_text(rs,encoding='utf-8')
          assert f'hd24-ui-v3.css?v={css_ver}' in rs
          assert f'hd24-ui-v3.js?v={js_ver}' in rs
          print(f'Approved UI + runtime refresh alignment: css=v{css_ver}, js=v{js_ver}; index_changed={changed}; refresh_changed={rs!=r0}')
          PY
      - name: Verify no stale v3 reinjection logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('.github/workflows/apply-approved-ui.yml').read_text(encoding='utf-8')
          # Dynamic derivation is enforced by the assertions below; avoid self-referential literal scans.
          assert 'Derive the outer UI cache version from the currently deployed index instead.' in s
          # safe-kpi-mapping is an active production runtime; only stale fixed-version reinjection is forbidden.
          # Active safe-kpi runtime is validated by the dedicated runtime regression gate.
          assert 'Cannot determine current HD24 outer UI cache version' in s
          assert "re.sub(r'hd24-ui-v3\\.css\\?v=\\d+'" in s
          assert "re.sub(r'hd24-ui-v3\\.js\\?v=\\d+'" in s
          assert "Path('refresh-runtime.html')" in s
          print('STALE CACHE REINJECTION/ALIGNMENT GATE PASS')
          PY
      - name: Commit approved UI references
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html refresh-runtime.html
          git commit -m "feat: apply approved UI references"
          git push
