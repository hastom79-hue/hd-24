<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD24 Upload Readiness Diagnostics</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;background:#f5f7fa;color:#183247;margin:0}.wrap{max-width:980px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #d9e2ea;border-radius:12px;padding:20px;margin-bottom:14px}.row{display:grid;grid-template-columns:210px 1fr;gap:12px;align-items:center;margin:10px 0}input,select{padding:9px;width:100%;box-sizing:border-box}.st{display:flex;justify-content:space-between;border-bottom:1px solid #edf1f4;padding:10px 0}.ok{color:#16784b;font-weight:700}.fail{color:#b42318;font-weight:700}.wait{color:#8a6d1d;font-weight:700}pre{white-space:pre-wrap;background:#102331;color:#dbe7ef;padding:14px;border-radius:8px;min-height:100px}.big{font-size:20px;font-weight:800}</style></head><body><div class="wrap"><h1>HD24 파일 업로드 구동 진단</h1><div class="card"><div class="row"><b>사업장</b><select id="plant"><option value="brazil">브라질</option><option value="india">인도</option></select></div><div class="row"><b>원본 KPI 파일</b><input id="src" type="file" accept=".xlsx,.xlsm"></div><div class="row"><b>총괄파일</b><input id="master" type="file" accept=".xlsx,.xlsm"></div></div><div class="card"><div class="big" id="summary">대기 중</div><div id="checks"></div></div><div class="card"><b>진단 로그</b><pre id="log"></pre></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const $=id=>document.getElementById(id), state={src:null,master:null,zip:null,mapping:null};
const cfg={brazil:{mapping:'mapping_brazil.json',srcSheet:'HCEB KPIs',masterSheet:'브라질법인 KPI(26년 보고용)'},india:{mapping:'mapping_india.json',srcSheet:'Final With HQ Suggestion',masterSheet:'인도법인 KPI(26년 보고용)'}};
function log(s){$('log').textContent+=($('log').textContent?'\n':'')+s}
function item(name,ok,detail){return `<div class="st"><span>${name}</span><span class="${ok===true?'ok':ok===false?'fail':'wait'}">${ok===true?'PASS':ok===false?'FAIL':'WAIT'}${detail?' · '+detail:''}</span></div>`}
function render(){const c=cfg[$('plant').value], rows=[];rows.push(item('SheetJS(XLSX)',!!window.XLSX));rows.push(item('JSZip',!!window.JSZip));rows.push(item('ExcelJS',!!window.ExcelJS));rows.push(item('KPI 매핑 JSON',Array.isArray(state.mapping)&&state.mapping.length>0,state.mapping?state.mapping.length+'건':''));rows.push(item('원본 파일 파싱',!!state.src));rows.push(item('원본 대상 시트',state.src?!!state.src.Sheets[c.srcSheet]:null,c.srcSheet));rows.push(item('총괄파일 파싱',!!state.master));rows.push(item('총괄 ZIP 파싱',!!state.zip));rows.push(item('총괄 대상 시트',state.master?!!state.master.Sheets[c.masterSheet]:null,c.masterSheet));const ok=!!(window.XLSX&&window.JSZip&&window.ExcelJS&&state.mapping?.length&&state.src&&state.src.Sheets[c.srcSheet]&&state.master&&state.zip&&state.master.Sheets[c.masterSheet]);$('checks').innerHTML=rows.join('');$('summary').textContent=ok?'파일 업로드 준비조건 PASS':'아래 FAIL/WAIT 항목 확인';$('summary').className='big '+(ok?'ok':'fail')}
async function loadMap(){state.mapping=null;render();const c=cfg[$('plant').value];try{const r=await fetch(c.mapping+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);state.mapping=await r.json();log('매핑 로드 PASS: '+c.mapping+' / '+state.mapping.length+'건')}catch(e){log('매핑 로드 FAIL: '+e.message)}render()}
$('plant').addEventListener('change',()=>{state.src=state.master=state.zip=null;$('src').value='';$('master').value='';loadMap()});
$('src').addEventListener('change',async e=>{const f=e.target.files[0];state.src=null;if(!f)return render();try{const b=await f.arrayBuffer();state.src=XLSX.read(b,{type:'array',cellDates:true});log('원본 파싱 PASS: '+f.name+' / sheets='+state.src.SheetNames.join(' | '))}catch(err){log('원본 파싱 FAIL: '+err.message)}render()});
$('master').addEventListener('change',async e=>{const f=e.target.files[0];state.master=null;state.zip=null;if(!f)return render();try{const b=await f.arrayBuffer();state.master=XLSX.read(b,{type:'array',cellDates:true});state.zip=await JSZip.loadAsync(b);log('총괄 파싱 PASS: '+f.name+' / sheets='+state.master.SheetNames.join(' | '))}catch(err){log('총괄 파싱 FAIL: '+err.message)}render()});
window.addEventListener('load',()=>{render();loadMap()});
</script></body></html>
