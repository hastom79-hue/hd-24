<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD-24 Runtime Health</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 18px;color:#1f2937}h1{font-size:22px}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #e5e7eb}.ok{color:#166534;font-weight:700}.bad{color:#b91c1c;font-weight:700}.wait{color:#92400e;font-weight:700}code{font-size:12px}button{margin-top:22px;padding:10px 14px;border:0;border-radius:6px;background:#234968;color:#fff;font-weight:700}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script></head><body><h1>HD-24 Runtime Health</h1><p>외부 라이브러리와 HD-24 실행파일이 실제 브라우저에서 로드되는지 확인합니다.</p><div id="rows"></div><button id="btnReflect" style="display:none" aria-hidden="true"></button><button onclick="location.href='./?runtime_health='+Date.now()">HD-24 열기</button><script>const rows=document.getElementById('rows');function add(name,state,detail){const d=document.createElement('div');d.className='row';d.innerHTML='<span>'+name+'</span><span class="'+(state?'ok':'bad')+'">'+(state?'PASS':'FAIL')+(detail?' · <code>'+detail+'</code>':'')+'</span>';rows.appendChild(d)}function load(src){return new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)})}const sleep=ms=>new Promise(r=>setTimeout(r,ms));(async()=>{const primary={XLSX:typeof XLSX!=='undefined',JSZip:typeof JSZip!=='undefined',ExcelJS:typeof ExcelJS!=='undefined'};const ui=await load('./hd24-ui-v3.js?v=15&health='+Date.now());add('HD24 UI loader',ui,'local');for(let i=0;i<20;i++){const btn=document.getElementById('btnReflect');if(typeof XLSX!=='undefined'&&typeof JSZip!=='undefined'&&typeof ExcelJS!=='undefined'&&window.hd24SafeReflectReady===true&&btn&&btn.dataset.safeReflectReady==='1')break;await sleep(400)}add('SheetJS / XLSX',typeof XLSX!=='undefined',primary.XLSX?'cdnjs':'fallback');add('JSZip',typeof JSZip!=='undefined',primary.JSZip?'cdnjs':'fallback');add('ExcelJS',typeof ExcelJS!=='undefined',primary.ExcelJS?'cdnjs':'fallback');const btn=document.getElementById('btnReflect');add('Safe runtime',window.hd24SafeReflectReady===true&&btn&&btn.dataset.safeReflectReady==='1','v18');if(typeof XLSX==='undefined'||typeof JSZip==='undefined'||typeof ExcelJS==='undefined'){const p=document.createElement('p');p.className='bad';p.textContent='필수 라이브러리 최종 로드 실패가 확인되었습니다. cdnjs와 보조 CDN 모두 차단되었을 가능성이 있습니다.';document.body.appendChild(p)}})();</script></body></html>
