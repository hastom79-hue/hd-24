name: HD24 classify historical mismatches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify Jan-Jun source-master differences
        run: |
          python - <<'PY'
          import json,base64,zlib,re,math
          from pathlib import Path
          snap=json.loads(zlib.decompress(base64.b64decode(Path('qa/tmp_validation_snapshot.b64').read_text().strip())).decode())
          mi=json.loads(Path('mapping_india.json').read_text())
          mb=json.loads(Path('mapping_brazil.json').read_text())
          def add_runtime(data,plant):
            d=list(data); names={x['kpiEn'] for x in d}
            if plant=='india' and 'Manufacturing Lead Time (Fab Tacking to FDI out)' not in names:
              d.append({'labelRow':94,'actualRow':95,'kpiEn':'Manufacturing Lead Time (Fab Tacking to FDI out)','masterRow':42,'kpiKr':'제조 리드타임(Fab.to Machine Stock)','scale':1,'valueFormat':'숫자','unit':'일'})
            if plant=='brazil' and 'IQ 200 Issues with Production responsibility (Assembly)' not in names:
              d.append({'labelRow':62,'actualRow':63,'kpiEn':'IQ 200 Issues with Production responsibility (Assembly)','masterRow':34,'kpiKr':'IQ200(생산귀책)','scale':1,'valueFormat':'숫자','unit':'DPTU'})
            return d
          def norm(v,fmt):
            if v is None or v=='': return None
            if isinstance(v,(int,float)):
              x=float(v)
              if fmt=='시간serial': x*=24
              return x
            s=str(v).strip().replace(',','')
            m=re.fullmatch(r'([+-]?\d+):(\d+)(?::(\d+))?',s)
            if m: return float(m.group(1))+float(m.group(2))/60+float(m.group(3) or 0)/3600
            m=re.fullmatch(r'([+-]?\d+(?:\.\d+)?)%',s)
            if m: return float(m.group(1))
            try: return float(s)
            except: return None
          def annotated_num(v):
            if not isinstance(v,str): return None
            s=v.strip().replace(',','')
            m=re.match(r'^([+-]?\d+(?:\.\d+)?)',s)
            return float(m.group(1)) if m else None
          def eq(a,b,eps=1e-6):
            return abs(a-b)<=eps or abs(a-b)<=eps*max(1,abs(a),abs(b))
          def display_rounding_equiv(expected,master_raw,mv):
            if mv is None or not isinstance(master_raw,(int,float)): return False
            s=str(master_raw)
            if 'e' in s.lower(): return False
            decimals=len(s.split('.',1)[1].rstrip('0')) if '.' in s else 0
            tol=0.5*(10**(-decimals))+1e-9
            return abs(expected-mv)<=tol
          def classify(plant,maps,src,master):
            out=[]; compared=0; skipped=0
            for x in add_runtime(maps,plant):
              sr=src.get(str(x['actualRow']),[None]*7); mr=master.get(str(x['masterRow']),[None]*7)
              for mo in range(1,7):
                raw=sr[mo-1] if mo-1<len(sr) else None
                nv=norm(raw,x.get('valueFormat','숫자'))
                if nv is None: skipped+=1; continue
                expected=nv*float(x.get('scale',1)); master_raw=mr[mo-1] if mo-1<len(mr) else None
                mv=norm(master_raw,'숫자'); compared+=1
                if mv is not None and eq(expected,mv): continue
                cat='genuine_value_difference'
                ann=annotated_num(master_raw)
                if isinstance(master_raw,str) and master_raw.strip()=='-' and eq(expected,0): cat='dash_zero_equivalent'
                elif ann is not None and eq(expected,ann): cat='annotated_numeric_same'
                elif isinstance(master_raw,str) and ('미집계' in master_raw or '미반영' in master_raw): cat='status_text_conflict'
                elif master_raw is None or master_raw=='': cat='master_blank'
                elif mv is None: cat='other_text_conflict'
                elif abs(expected)>1e-12 and abs(mv)<=1e-12: cat='master_zero_stale'
                elif display_rounding_equiv(expected,master_raw,mv): cat='display_rounding_equivalent'
                elif eq(expected*100,mv) or eq(expected/100,mv): cat='scale_100_pattern'
                elif eq(abs(expected),abs(mv)) and expected*mv<0: cat='sign_only'
                out.append({'plant':plant,'month':mo,'kpiEn':x['kpiEn'],'kpiKr':x.get('kpiKr'),'sourceRow':x['actualRow'],'masterRow':x['masterRow'],'raw':raw,'expected':expected,'master':master_raw,'category':cat})
            counts={}; kpis={}
            serious={'genuine_value_difference','master_zero_stale','status_text_conflict','master_blank','other_text_conflict','scale_100_pattern','sign_only'}
            for r in out:
              counts[r['category']]=counts.get(r['category'],0)+1
              if r['category'] in serious: kpis.setdefault(r['kpiEn'],set()).add(r['month'])
            serious_rows=[r for r in out if r['category'] in serious]
            return {'mappedKpis':len(add_runtime(maps,plant)),'comparedNumericCells':compared,'skippedNonNumericSourceCells':skipped,'mismatchCells':len(out),'counts':counts,'seriousMismatchCells':len(serious_rows),'seriousKpiCount':len(kpis),'seriousKpis':{k:sorted(v) for k,v in kpis.items()},'mismatches':out}
          report={'india':classify('india',mi,snap['si'],snap['mi']),'brazil':classify('brazil',mb,snap['sb'],snap['mb'])}
          report['summary']={'totalMappedKpis':report['india']['mappedKpis']+report['brazil']['mappedKpis'],'totalComparedNumericCells':report['india']['comparedNumericCells']+report['brazil']['comparedNumericCells'],'totalMismatchCells':report['india']['mismatchCells']+report['brazil']['mismatchCells'],'totalSeriousMismatchCells':report['india']['seriousMismatchCells']+report['brazil']['seriousMismatchCells'],'totalSeriousKpis':report['india']['seriousKpiCount']+report['brazil']['seriousKpiCount']}
          Path('qa/past_mismatch_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:{'mapped':report[k]['mappedKpis'],'compared':report[k]['comparedNumericCells'],'mismatch':report[k]['mismatchCells'],'seriousCells':report[k]['seriousMismatchCells'],'seriousKpis':report[k]['seriousKpiCount'],'counts':report[k]['counts']} for k in ('india','brazil')},ensure_ascii=False))
          PY
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/past_mismatch_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: refine real-file historical mismatch classification [skip ci]'
          git push
