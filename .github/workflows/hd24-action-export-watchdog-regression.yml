name: HD24 Action Export Watchdog Regression
on:
  push:
    branches: [main]
    paths:
      - 'hd24-action-export-watchdog.js'
      - 'tests/action-export-watchdog.test.js'
      - '.github/workflows/hd24-action-export-watchdog-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hd24-action-export-watchdog.js'
      - 'tests/action-export-watchdog.test.js'
      - '.github/workflows/hd24-action-export-watchdog-regression.yml'
permissions:
  contents: read
jobs:
  watchdog-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check watchdog runtime
        run: node --check hd24-action-export-watchdog.js
      - name: Verify legacy watchdog invariants
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const watchdog=fs.readFileSync('hd24-action-export-watchdog.js','utf8');
          assert(watchdog.includes('const WAKE_DELAYS=[0,2500,7000,15000,30000]'),'bounded wake schedule changed');
          assert(watchdog.includes('window.hd24SafeReflectSuccessSignature===sig'),'same-signature safe gate missing');
          assert(watchdog.includes("window.addEventListener('hd24-action-export-complete'"),'completion stop hook missing');
          console.log('PASS legacy watchdog invariants');
          NODE
      - name: Execute watchdog regression
        run: node tests/action-export-watchdog.test.js
