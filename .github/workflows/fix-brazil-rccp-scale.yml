name: Fix Brazil RCCP scale
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct RCCP numeric percentage scale
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mapping_brazil.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          target='M+1 Production Volume Variation Rate'
          hits=[x for x in data if x.get('kpiEn')==target]
          assert len(hits)==1, len(hits)
          x=hits[0]
          assert x.get('masterRow')==82
          assert x.get('unit')=='%'
          x['scale']=100
          x['valueFormat']='숫자'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')
          chk=json.loads(p.read_text(encoding='utf-8'))
          y=[x for x in chk if x.get('kpiEn')==target][0]
          assert y['scale']==100
          print('RCCP scale PASS:',y)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mapping_brazil.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: normalize Brazil RCCP percentage scale'
          git push