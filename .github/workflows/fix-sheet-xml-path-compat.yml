name: Fix sheet XML path compatibility
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch relationship parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('async function findSheetXmlPath(zip, name){')
          end=s.find('\nfunction fmtVal', start)
          if start<0 or end<0:
              raise SystemExit('findSheetXmlPath boundaries not found')
          old=s[start:end]
          if 'DOMParser' in old and "getElementsByTagName('Relationship')" in old:
              print('Compatibility parser already installed')
          else:
              new="""async function findSheetXmlPath(zip, name){
  const wbFile=zip.file('xl/workbook.xml'),relFile=zip.file('xl/_rels/workbook.xml.rels');
  if(!wbFile||!relFile)throw new Error('총괄 XLSX 구조 오류: workbook 관계파일 없음');
  const parser=new DOMParser();
  const wbDoc=parser.parseFromString(await wbFile.async('string'),'application/xml');
  const parseErr=wbDoc.getElementsByTagName('parsererror');
  if(parseErr.length)throw new Error('workbook.xml 파싱 실패');
  const sheet=[...wbDoc.getElementsByTagName('sheet')].find(x=>x.getAttribute('name')===name);
  if(!sheet)throw new Error('총괄 시트 없음: '+name);
  const rid=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  if(!rid)throw new Error('시트 관계 ID 확인 실패: '+name);
  const relDoc=parser.parseFromString(await relFile.async('string'),'application/xml');
  if(relDoc.getElementsByTagName('parsererror').length)throw new Error('workbook 관계 XML 파싱 실패');
  const relation=[...relDoc.getElementsByTagName('Relationship')].find(x=>x.getAttribute('Id')===rid);
  const target=relation&&relation.getAttribute('Target');
  if(!target)throw new Error('시트 경로 확인 실패: '+name+' / '+rid);
  let clean=target.replace(/\\\\/g,'/');
  clean=clean.startsWith('/')?clean.replace(/^\\/+/, ''):(clean.startsWith('xl/')?clean:'xl/'+clean);
  const parts=[];
  for(const part of clean.split('/')){if(!part||part==='.')continue;if(part==='..')parts.pop();else parts.push(part);}
  const path=parts.join('/');
  if(!zip.file(path))throw new Error('시트 XML 파일 없음: '+path);
  return path;
}"""
              s=s[:start]+new+s[end:]
              p.write_text(s,encoding='utf-8')
              print('Compatibility parser installed')
          PY
      - name: Static compatibility assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "new DOMParser()" in s
          assert "getElementsByTagName('Relationship')" in s
          assert "relation.getAttribute('Target')" in s
          assert "if(!zip.file(path))" in s
          print('SHEET XML RELATIONSHIP COMPATIBILITY PASS')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: sheet XML relationship compatibility [skip ci]"
          git push
