name: HD24 v14 unit runtime hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_v14_unit_runtime.py
      - name: Validate samples
        run: |
          node - <<'NODE'
          function f(v){const s=String(v??'').toLowerCase().replace(/\u00a0/g,' ').trim().replace(/\s+/g,'');if(!s)return '';if(s.includes('%')||s.includes('percent'))return 'pct';if(s.includes('dptu'))return 'dptu';if(s.includes('ppm'))return 'ppm';if(s.includes('mh/unit')||s.includes('mh/대')||s.includes('mhperunit')||s.includes('mhpermachine')||s.includes('mh/mc')||s.includes('mhper'))return 'mh';if(s==='hh:mm'||s==='time'||s==='hr'||s==='hrs'||s==='hrs.'||s==='hour'||s==='hours')return 'time';if(s.includes('day')||s==='일')return 'day';if(s==='인/건'||s.includes('cases/person')||s.includes('case/person')||s.includes('person/case')||s.includes('index'))return 'ratio';if(s==='nos.'||s==='nos'||s.includes('count')||s.includes('qty')||s.includes('quantity')||s.includes('case')||s.includes('건')||s==='대분')return 'count';if(s.includes('person')||s==='명'||s.includes('명/년'))return 'person';if(s.includes('turn')||s.includes('rev')||s==='회전')return 'turn';if(s.includes('score')||s.includes('point')||s==='점')return 'score';if(s.includes('$')||s.includes('usd')||s.includes('krw')||s.includes('inr')||s.includes('brl'))return 'currency';return '';}
          const t={'%':'pct','MH/대':'mh','MH/Unit ':'mh','Hrs.':'time','Time':'time','HH:MM':'time','Days':'day','No. of Days':'day','Nos.':'count','cases':'count','Cases/person':'ratio','인/건':'ratio','Index':'ratio','Persons':'person','Turns':'turn','Points':'score','INR (Cr.)':'currency','$M':'currency'};
          for(const [k,v] of Object.entries(t)){if(f(k)!==v)throw new Error(k+':'+f(k)+'!='+v)}
          console.log('UNIT_SAMPLE_PASS',Object.keys(t).length);
          NODE
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add safe-kpi-mapping.js hd24-ui-v3.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: correct runtime unit normalization and blank Actual handling [skip ci]'
          git push