name: HD24 classify historical mismatches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify Jan-Jun source-master differences
        run: |
          python - <<'PY'
          import json,base64,zlib,re,math
          from pathlib import Path
          snap=json.loads(zlib.decompress(base64.b64decode(Path('qa/tmp_validation_snapshot.b64').read_text().strip())).decode())
          mi=json.loads(Path('mapping_india.json').read_text())
          mb=json.loads(Path('mapping_brazil.json').read_text())
          def add_runtime(data,plant):
            d=list(data); names={x['kpiEn'] for x in d}
            if plant=='india' and 'Manufacturing Lead Time (Fab Tacking to FDI out)' not in names:
              d.append({'labelRow':94,'actualRow':95,'kpiEn':'Manufacturing Lead Time (Fab Tacking to FDI out)','masterRow':42,'kpiKr':'제조 리드타임(Fab.to Machine Stock)','scale':1,'valueFormat':'숫자','unit':'일'})
            if plant=='brazil' and 'IQ 200 Issues with Production responsibility (Assembly)' not in names:
              d.append({'labelRow':62,'actualRow':63,'kpiEn':'IQ 200 Issues with Production responsibility (Assembly)','masterRow':34,'kpiKr':'IQ200(생산귀책)','scale':1,'valueFormat':'숫자','unit':'DPTU'})
            return d
          def norm(v,fmt):
            if v is None or v=='': return None
            if isinstance(v,(int,float)):
              x=float(v)
              if fmt=='시간serial': x*=24
              return x
            s=str(v).strip().replace(',','')
            m=re.fullmatch(r'([+-]?\d+):(\d+)(?::(\d+))?',s)
            if m: return float(m.group(1))+float(m.group(2))/60+float(m.group(3) or 0)/3600
            m=re.fullmatch(r'([+-]?\d+(?:\.\d+)?)%',s)
            if m: return float(m.group(1))
            try: return float(s)
            except: return None
          def eq(a,b,eps=1e-6):
            return abs(a-b)<=eps or abs(a-b)<=eps*max(1,abs(a),abs(b))
          def classify(plant,maps,src,master):
            out=[]; compared=0; skipped=0
            for x in add_runtime(maps,plant):
              sr=src.get(str(x['actualRow']),[None]*7); mr=master.get(str(x['masterRow']),[None]*7)
              for mo in range(1,7):
                raw=sr[mo-1] if mo-1<len(sr) else None
                nv=norm(raw,x.get('valueFormat','숫자'))
                if nv is None: skipped+=1; continue
                expected=nv*float(x.get('scale',1))
                mv=norm(mr[mo-1] if mo-1<len(mr) else None,'숫자')
                compared+=1
                if mv is not None and eq(expected,mv): continue
                cat='genuine'
                if mv is None: cat='master_blank_or_text'
                elif abs(expected)>1e-12 and abs(mv)<=1e-12: cat='master_zero_stale'
                elif any(eq(round(expected,d),mv,1e-9) or eq(expected,round(mv,d),1e-9) for d in (0,1,2,3)): cat='rounding_only'
                elif eq(expected*100,mv) or eq(expected/100,mv): cat='scale_100_pattern'
                elif eq(abs(expected),abs(mv)) and expected*mv<0: cat='sign_only'
                out.append({'plant':plant,'month':mo,'kpiEn':x['kpiEn'],'kpiKr':x.get('kpiKr'),'sourceRow':x['actualRow'],'masterRow':x['masterRow'],'raw':raw,'expected':expected,'master':mr[mo-1] if mo-1<len(mr) else None,'category':cat})
            counts={}
            for r in out: counts[r['category']]=counts.get(r['category'],0)+1
            return {'mappedKpis':len(add_runtime(maps,plant)),'comparedNumericCells':compared,'skippedNonNumericSourceCells':skipped,'mismatchCells':len(out),'counts':counts,'mismatches':out}
          report={'india':classify('india',mi,snap['si'],snap['mi']),'brazil':classify('brazil',mb,snap['sb'],snap['mb'])}
          report['summary']={
            'totalMappedKpis':report['india']['mappedKpis']+report['brazil']['mappedKpis'],
            'totalComparedNumericCells':report['india']['comparedNumericCells']+report['brazil']['comparedNumericCells'],
            'totalMismatchCells':report['india']['mismatchCells']+report['brazil']['mismatchCells']
          }
          Path('qa/past_mismatch_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:{'mapped':report[k]['mappedKpis'],'compared':report[k]['comparedNumericCells'],'mismatch':report[k]['mismatchCells'],'counts':report[k]['counts']} for k in ('india','brazil')},ensure_ascii=False))
          PY
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/past_mismatch_report.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: classify real-file historical KPI mismatches [skip ci]'
          git push
