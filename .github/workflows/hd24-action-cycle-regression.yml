name: HD24 Action Cycle Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cycle-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate current production follow-up/reply cycle
        run: |
          node --check hd24-followup.js
          node --check hd24-direct-reply-guard.js
          node --check hd24-reply-import-dedupe.js
          node tests/direct-reply-guard.test.js
          node tests/reply-import-dedupe.test.js
          node tests/followup-exact-once.test.js
          node tests/followup-inflight-dedupe.test.js
