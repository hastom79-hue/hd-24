name: HD24 Reply Panels Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'hd24-ui-v3.js'
      - 'refresh-runtime.html'
      - 'hd24-reply-feedback.js'
      - 'hd24-followup.js'
      - 'hd24-reply-deep-validation.js'
      - 'hd24-rule-matrix-v1.js'
      - '.github/workflows/hd24-reply-panels-e2e.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'hd24-ui-v3.js'
      - 'refresh-runtime.html'
      - 'hd24-reply-feedback.js'
      - 'hd24-followup.js'
      - 'hd24-reply-deep-validation.js'
      - '.github/workflows/hd24-reply-panels-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reply-panels-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python -m http.server 8768 --bind 127.0.0.1 > /tmp/hd24-reply-http.log 2>&1 &
          for i in {1..20}; do if curl -fsS http://127.0.0.1:8768/index.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/hd24-reply-http.log; exit 1
      - name: Verify refresh preload matches production loader
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          loader=Path('hd24-ui-v3.js').read_text(encoding='utf-8')
          refresh=Path('refresh-runtime.html').read_text(encoding='utf-8')
          assets=set(re.findall(r'[\w-]+\.js\?v=\d+',loader))
          missing=sorted(asset for asset in assets if asset not in refresh)
          assert assets, 'No production JavaScript assets detected'
          assert not missing, f'Refresh preload missing production assets: {missing}'
          print(f'PASS: refresh preloads all {len(assets)} production JavaScript assets')
          PY
      - name: Validate loaded JavaScript syntax
        run: |
          python - <<'PY'
          import re, subprocess, urllib.request
          html=urllib.request.urlopen('http://127.0.0.1:8768/index.html').read().decode('utf-8','replace')
          queue=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+\\.js(?:\\?[^"\\\']*)?)["\\\']',html,re.I)
          seen=set()
          while queue:
              src=queue.pop(0)
              clean=src.split('?')[0].lstrip('./')
              if clean in seen: continue
              seen.add(clean)
              try:
                  body=urllib.request.urlopen('http://127.0.0.1:8768/'+clean).read().decode('utf-8','replace')
              except Exception:
                  continue
              p=subprocess.run(['node','--check'],input=body,text=True,capture_output=True)
              assert p.returncode==0, f'{clean} JS syntax failed:\\n{p.stderr}'
              for child in re.findall(r'["\\\'](?:\\./)?([^"\\\']+\\.js\\?v=[^"\\\']+)["\\\']',body):
                  queue.append(child)
          print('Loaded JS syntax PASS:', ', '.join(sorted(seen)))
          PY
      - name: Verify mail API success acknowledgement guard
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('hd24-reply-feedback.js').read_text(encoding='utf-8')
          assert "api.success!==true" in source, 'Mail API success must be explicitly true'
          assert "JSON 형식이 아닙니다" in source, 'Non-JSON mail API response must fail'
          assert "status:'outlook-package-downloaded'" in source, 'EML package must be logged separately from sent mail'
          assert "status:'send-failed'" in source, 'Failed sends must have distinct log status'
          print('PASS: mail response guard and EML vs sent log status separation')
          PY
      - name: Verify asynchronous feedback Excel version guards
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('hd24-reply-feedback.js').read_text(encoding='utf-8')
          assert 'function exportFeedbackWorkbook(rows,plant,expectedExportKey=lastExportKey)' in source
          assert 'expectedExportKey!==lastExportKey' in source
          assert "(get('plantSelect')?.value||'india')!==plant" in source
          assert 'exportFeedbackWorkbook(rows,plant,exportKey).catch(e=>{if(lastExportKey!==exportKey)return;' in source
          print('PASS: stale Excel export results and failures cannot overwrite newer version state')
          PY
      - name: Verify latest reply ordering and Excel cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('hd24-reply-feedback.js').read_text(encoding='utf-8')
          assert source.count("Number(b.replySequence||0)-Number(a.replySequence||0)")>=2, 'Screen and Excel history must share tie-breaker'
          assert "JSON.stringify({rows,saved:all.filter(r=>r.plant===plant)})" in source, 'Excel cache must include complete reply history'
          assert "const nextKey=plant+'|'+JSON.stringify({rows,saved:all});" in source, 'Draft cache must include complete reply content and history'
          for loader in ('hd24-ui-v3.js','refresh-runtime.html'):
              assert 'hd24-reply-feedback.js?v=89' in Path(loader).read_text(encoding='utf-8'), loader
          print('PASS: screen/Excel ordering, history cache key and v89 loaders')
          PY
      - name: English dashboards and refresh regression (browser)
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              errors=[]
              page.on('pageerror',lambda e: errors.append(str(e)))
              page.goto('http://127.0.0.1:8768/index.html',wait_until='domcontentloaded',timeout=120000)
              print('INITIALIZATION CHECK: waiting for feedback and deep validation globals',flush=True)
              try:
                  page.wait_for_function("window.hd24ReplyFeedback && window.hd24DeepReplyValidation",timeout=30000)
              except Exception:
                  from pathlib import Path
                  Path('test-results').mkdir(exist_ok=True)
                  try:
                      page.screenshot(path='test-results/initialization-failure.png',full_page=True,timeout=5000)
                  except Exception as capture_error:
                      print(f'INITIALIZATION SCREENSHOT UNAVAILABLE: {capture_error}',flush=True)
                  print('INITIALIZATION FAILURE',page.evaluate("""() => ({
                    readyState:document.readyState,
                    feedbackReady:!!window.hd24ReplyFeedback,
                    deepReady:!!window.hd24DeepReplyValidation,
                    tabBarPresent:!!document.querySelector('.hd24-tab'),
                    scriptCount:document.scripts.length,
                    scriptSources:Array.from(document.scripts).map(s=>s.src).filter(Boolean).slice(-12)
                  })"""),'pageErrors=',errors,flush=True)
                  raise
              page.evaluate("""() => {
                localStorage.setItem('hd24_kpi_reply_history_v2',JSON.stringify([
                  {plant:'india',targetYear:2026,targetMonth:7,kpi:'Test KPI',kpiEn:'Test KPI',
                   reason:'Specific missed target reason',rootCause:'Repeated supplier delay',
                   recoveryPlan:'Weekly corrective-action effectiveness check',
                   actionOwner:'Owner A',plannedCompletionDate:'2026-10-31',replySequence:1},
                  {plant:'india',targetYear:2026,targetMonth:8,kpi:'Test KPI',kpiEn:'Test KPI',
                   reason:'Specific missed target reason',rootCause:'Repeated supplier delay',
                   recoveryPlan:'Weekly corrective-action effectiveness check',
                   actionOwner:'Owner A',plannedCompletionDate:'2026-10-31',replySequence:1}
                ]));
                window.hd24ReplyFeedback.render();
                window.hd24DeepReplyValidation.render();
              }""")
              page.wait_for_function("typeof window.hd24SwitchTab === 'function'",timeout=15000)
              page.evaluate("window.hd24SwitchTab('replyanalysis')")
              page.wait_for_function("document.querySelector('.hd24-tab.active')?.dataset.tab === 'replyanalysis' && sessionStorage.getItem('hd24_active_tab') === 'replyanalysis'",timeout=15000)
              page.wait_for_selector('#hd24DashboardLanguageSelect',state='attached',timeout=15000)
              page.evaluate("""() => { const el=document.getElementById('hd24DashboardLanguageSelect'); if(!el)throw new Error('Dashboard language selector missing'); el.value='en'; el.dispatchEvent(new Event('change',{bubbles:true})); }""")
              page.wait_for_timeout(350)
              for ident in ('hd24ExecutiveDashboard','hd24DeepValidation'):
                  content=page.locator('#'+ident).inner_text()
                  remaining=re.findall(r'[가-힣]+',content)
                  assert not remaining, f'{ident} has untranslated Korean: {remaining[:20]}'
              assert not errors, errors
              baseline=page.evaluate("""() => ({
                history: localStorage.getItem('hd24_kpi_reply_history_v2'),
                executive: document.getElementById('hd24ExecutiveDashboard')?.innerText.trim(),
                deep: document.getElementById('hd24DeepValidation')?.innerText.trim()
              })""")
              assert baseline['history'], 'Fixture reply history missing before refresh'
              assert baseline['executive'] and baseline['deep'], 'Baseline dashboard content missing'
              assert page.locator('#hd24DashboardLanguageSelect').input_value()=='en', 'English selection not active before refresh'
              for attempt in range(3):
                  print(f'REFRESH START attempt={attempt+1} baseline executive={len(baseline["executive"])} deep={len(baseline["deep"])}',flush=True)
                  page.reload(wait_until='domcontentloaded')
                  print(f'REFRESH LOADED attempt={attempt+1} ready={page.evaluate("document.readyState")}',flush=True)
                  waits=[
                    ('restore replyanalysis tab',"document.querySelector('.hd24-tab.active')?.dataset.tab === 'replyanalysis'",None),
                    ('initialize reply feedback and deep validation',"window.hd24ReplyFeedback && window.hd24DeepReplyValidation",None),
                    ('restore identical dashboard contents',"""baseline => {
                      const executive=document.getElementById('hd24ExecutiveDashboard')?.innerText.trim();
                      const deep=document.getElementById('hd24DeepValidation')?.innerText.trim();
                      return executive===baseline.executive && deep===baseline.deep;
                    }""",baseline)
                  ]
                  for label,condition,arg in waits:
                      print(f'REFRESH CHECK attempt={attempt+1} condition={label}',flush=True)
                      try:
                          page.wait_for_function(condition,arg=arg,timeout=15000)
                      except Exception as exc:
                          state=page.evaluate("""() => ({
                            activeTab:document.querySelector('.hd24-tab.active')?.dataset.tab,
                            savedTab:sessionStorage.getItem('hd24_active_tab'),
                            feedbackReady:!!window.hd24ReplyFeedback,
                            deepReady:!!window.hd24DeepReplyValidation,
                            selectedLanguage:document.getElementById('hd24DashboardLanguageSelect')?.value,
                            savedLanguage:sessionStorage.getItem('hd24_dashboard_language_v1'),
                            executiveLength:document.getElementById('hd24ExecutiveDashboard')?.innerText.trim().length||0,
                            deepLength:document.getElementById('hd24DeepValidation')?.innerText.trim().length||0
                          })""")
                          observed=page.evaluate("""() => ({
                            executive:document.getElementById('hd24ExecutiveDashboard')?.innerText.trim()||'',
                            deep:document.getElementById('hd24DeepValidation')?.innerText.trim()||''
                          })""")
                          state['executiveMatchesBaseline']=observed['executive']==baseline['executive']
                          state['deepMatchesBaseline']=observed['deep']==baseline['deep']
                          state['executivePreview']=observed['executive'][:250]
                          state['deepPreview']=observed['deep'][:250]
                          print(f'REFRESH FAILURE attempt={attempt+1} condition={label} state={state} errors={errors}',flush=True)
                          from pathlib import Path
                          import json
                          Path('test-results').mkdir(exist_ok=True)
                          Path(f'test-results/refresh-{attempt+1}-failure.json').write_text(json.dumps({'condition':label,'state':state,'errors':errors},ensure_ascii=False,indent=2),encoding='utf-8')
                          try:
                              page.screenshot(path=f'test-results/refresh-{attempt+1}-failure.png',full_page=True,timeout=5000)
                          except Exception as capture_error:
                              print(f'REFRESH SCREENSHOT UNAVAILABLE: {capture_error}',flush=True)
                          raise
                  assert page.locator('#hd24ExecutiveDashboard').inner_text().strip(), f'Empty executive dashboard after reload {attempt+1}'
                  assert page.locator('#hd24DeepValidation').inner_text().strip(), f'Empty deep validation after reload {attempt+1}'
                  current=page.evaluate("""() => ({
                    history: localStorage.getItem('hd24_kpi_reply_history_v2'),
                    executive: document.getElementById('hd24ExecutiveDashboard')?.innerText.trim(),
                    deep: document.getElementById('hd24DeepValidation')?.innerText.trim()
                  })""")
                  assert page.locator('#hd24DashboardLanguageSelect').input_value()=='en', f'Language selection reset after reload {attempt+1}'
                  assert page.evaluate("sessionStorage.getItem('hd24_dashboard_language_v1')")=='en', f'Saved language lost after reload {attempt+1}'
                  for ident in ('hd24ExecutiveDashboard','hd24DeepValidation'):
                      remaining=re.findall(r'[가-힣]+',page.locator('#'+ident).inner_text())
                      assert not remaining, f'{ident} has Korean after reload {attempt+1}: {remaining[:20]}'
                  assert current['history']==baseline['history'], f'Reply history changed after reload {attempt+1}'
                  assert current['executive']==baseline['executive'], f'Executive KPI dashboard changed after reload {attempt+1}'
                  assert current['deep']==baseline['deep'], f'Deep validation dashboard changed after reload {attempt+1}'
                  assert not errors, f'Browser errors after reload {attempt+1}: {errors}'
              print('PASS: English dashboards and three consecutive refreshes preserve selected tab and nonempty panels')
              browser.close()
          PY
      - name: End-to-end Outlook package generation with embedded PNGs and Excel
        run: |
          python - <<'PY'
          import re, email, zipfile, io
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(accept_downloads=True)
              page.goto('http://127.0.0.1:8768/index.html',wait_until='domcontentloaded',timeout=120000)
              page.wait_for_function("window.hd24ReplyFeedback && window.hd24DeepReplyValidation",timeout=30000)
              page.evaluate("""() => {
                localStorage.removeItem('hd24_mail_endpoint_v1');
                window.HD24_MAIL_ENDPOINT='';
                localStorage.setItem('hd24_kpi_reply_history_v2',JSON.stringify([
                  {plant:'india',targetYear:2026,targetMonth:7,kpi:'Sample KPI',kpiEn:'Sample KPI',
                   reason:'Specific production delay',rootCause:'Material shortage',
                   recoveryPlan:'Supplier escalation and weekly verification',actionOwner:'Owner A',
                   plannedCompletionDate:'2026-10-31',replySequence:1},
                  {plant:'india',targetYear:2026,targetMonth:8,kpi:'Sample KPI',kpiEn:'Sample KPI',
                   reason:'Specific production delay',rootCause:'Material shortage',
                   recoveryPlan:'Supplier escalation and weekly verification',actionOwner:'Owner A',
                   plannedCompletionDate:'2026-10-31',replySequence:1}
                ]));
                document.getElementById('plantSelect').value='india';
                document.getElementById('mailTo').value='qa-example@example.invalid';
                window.hd24ReplyFeedback.render();
                window.hd24DeepReplyValidation.render();
              }""")
              page.wait_for_function("typeof window.hd24SwitchTab === 'function'",timeout=15000)
              page.evaluate("window.hd24SwitchTab('replymail')")
              page.wait_for_selector('#hd24FeedbackSend',state='attached',timeout=15000)
              page.evaluate("""() => { const el=document.getElementById('hd24DashboardLanguageSelect'); if(!el)throw new Error('Dashboard language selector missing'); el.value='en'; el.dispatchEvent(new Event('change',{bubbles:true})); }""")
              page.wait_for_timeout(300)
              with page.expect_download(timeout=60000) as downloaded:
                  page.locator('#hd24FeedbackSend').click()
              artifact=downloaded.value
              data=open(artifact.path(),'rb').read()
              msg=email.message_from_bytes(data)
              assert msg.get('X-Unsent')=='1','Package must be an unsent Outlook draft'
              parts=list(msg.walk())
              png=[part for part in parts if part.get_content_type()=='image/png']
              xlsx=[part for part in parts if part.get_content_type()=='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet']
              assert len(png)==2,f'Expected 2 PNG dashboards, got {len(png)}'
              assert len(xlsx)==1,f'Expected 1 Excel attachment, got {len(xlsx)}'
              assert all((part.get_payload(decode=True) or b'').startswith(bytes.fromhex('89504e47')) for part in png),'Invalid PNG payload'
              with zipfile.ZipFile(io.BytesIO(xlsx[0].get_payload(decode=True))) as z:
                  names=z.namelist()
                  assert 'xl/workbook.xml' in names,'Invalid Excel workbook'
                  assert len([n for n in names if re.fullmatch(r'xl/worksheets/sheet\\d+\\.xml',n)])>=3,'Missing workbook evidence/detail sheets'
              html=' '.join((part.get_payload(decode=True) or b'').decode('utf-8','replace') for part in parts if part.get_content_type()=='text/html')
              assert all('cid:'+part.get('Content-ID','').strip('<>') in html for part in png),'Missing embedded dashboard CID reference'
              page.locator('#hd24FeedbackDraft').fill('STALE_DRAFT_SENTINEL_FROM_PRIOR_REPLY')
              # A change to a prior reply must invalidate the generated workbook.
              page.evaluate("""() => {
                const key='hd24_kpi_reply_history_v2';
                const history=JSON.parse(localStorage.getItem(key));
                history[0].rootCause='Revised historical root cause - verified by QA';
                localStorage.setItem(key,JSON.stringify(history));
                window.hd24ReplyFeedback.render();
              }""")
              assert 'STALE_DRAFT_SENTINEL_FROM_PRIOR_REPLY' not in page.locator('#hd24FeedbackDraft').input_value(), 'Reply edit retained stale feedback email draft'
              assert len(page.locator('#hd24FeedbackDraft').input_value().strip())>30, 'Regenerated feedback email draft is empty or truncated'
              with page.expect_download(timeout=60000) as changed_download:
                  page.locator('#hd24FeedbackSend').click()
              changed=email.message_from_bytes(open(changed_download.value.path(),'rb').read())
              assert changed.get('X-Unsent')=='1', 'Generated Outlook draft must remain explicitly unsent'
              changed_text=' '.join((part.get_payload(decode=True) or b'').decode('utf-8','replace') for part in changed.walk() if part.get_content_type() in ('text/plain','text/html'))
              assert 'STALE_DRAFT_SENTINEL_FROM_PRIOR_REPLY' not in changed_text, 'Stale feedback draft leaked into regenerated Outlook package'
              changed_xlsx=[part for part in changed.walk() if part.get_content_type()=='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet']
              assert len(changed_xlsx)==1,'Updated reply must still have exactly one Excel attachment'
              assert changed_xlsx[0].get_payload(decode=True)!=xlsx[0].get_payload(decode=True),'Historical reply change did not regenerate Excel'
              with zipfile.ZipFile(io.BytesIO(changed_xlsx[0].get_payload(decode=True))) as z:
                  xml=' '.join(z.read(n).decode('utf-8','replace') for n in z.namelist() if n.startswith('xl/') and n.endswith('.xml'))
                  assert 'Revised historical root cause - verified by QA' in xml, 'Edited root cause is absent from regenerated workbook'
                  from xml.etree import ElementTree as ET
                  ns={'x':'http://schemas.openxmlformats.org/spreadsheetml/2006/main','r':'http://schemas.openxmlformats.org/officeDocument/2006/relationships','p':'http://schemas.openxmlformats.org/package/2006/relationships'}
                  wb=ET.fromstring(z.read('xl/workbook.xml'))
                  sheet=next((x for x in wb.findall('x:sheets/x:sheet',ns) if x.attrib.get('name')=='Source KPI Evidence'),None)
                  assert sheet is not None, 'Source KPI Evidence worksheet is missing'
                  rel_id=sheet.attrib.get('{'+ns['r']+'}id')
                  rels=ET.fromstring(z.read('xl/_rels/workbook.xml.rels'))
                  rel=next((x for x in rels.findall('p:Relationship',ns) if x.attrib.get('Id')==rel_id),None)
                  assert rel is not None, 'Evidence worksheet relationship is missing'
                  import posixpath
                  raw_target=rel.attrib['Target']
                  target=raw_target.lstrip('/') if raw_target.startswith('/') else posixpath.normpath(posixpath.join('xl',raw_target))
                  assert target.startswith('xl/worksheets/') and target in z.namelist(), 'Evidence worksheet target is invalid: '+target
                  evidence=ET.fromstring(z.read(target))
                  shared=[]
                  if 'xl/sharedStrings.xml' in z.namelist():
                      strings=ET.fromstring(z.read('xl/sharedStrings.xml'))
                      shared=[''.join(t.text or '' for t in item.findall('.//x:t',ns)) for item in strings.findall('x:si',ns)]
                  values=[]
                  for row in evidence.findall('x:sheetData/x:row',ns):
                      for cell in row.findall('x:c',ns):
                          if not re.fullmatch(r'I(?:[2-9]|[1-9][0-9]+)',cell.attrib.get('r','')): continue
                          v=cell.find('x:v',ns)
                          inline=cell.find('x:is',ns)
                          if cell.attrib.get('t')=='s' and v is not None:
                              values.append(shared[int(v.text)])
                          elif inline is not None:
                              values.append(''.join(t.text or '' for t in inline.findall('.//x:t',ns)))
                          elif v is not None:
                              values.append(v.text or '')
                  assert len(values)==2, f'Expected both historical KPI source rows, got {len(values)}'
                  assert values.count('Revised historical root cause - verified by QA')==1, 'Edited historical root cause missing or duplicated in evidence I column'
                  assert values.count('Material shortage')==1, 'Untouched historical root cause was lost or overwritten'
              print('PASS: historical reply change invalidates attached Excel')
              print('PASS: unsent EML includes two valid inline PNG dashboards and three-sheet Excel')
              browser.close()
          PY
      - name: Reply analysis and feedback mail must never render blank
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              errors=[]
              page.add_init_script("window.__hd24WindowErrors=[]; window.addEventListener('error',e=>window.__hd24WindowErrors.push({message:e.message,filename:e.filename,lineno:e.lineno,colno:e.colno}));")
              page.on('pageerror',lambda e: errors.append(str(e)+' | '+str(getattr(e,'stack', '') or '')))
              page.goto('http://127.0.0.1:8768/index.html',wait_until='domcontentloaded',timeout=120000)
              # Inspect inline scripts after navigation, before exercising the UI.
              page_scripts=page.locator('script:not([src])')
              for i in range(page_scripts.count()):
                  body=page_scripts.nth(i).text_content() or ''
                  if body.strip():
                      import subprocess
                      p=subprocess.run(['node','--check'],input=body,text=True,capture_output=True)
                      assert p.returncode==0, f'Inline script {i} syntax failed: {p.stderr}'

              page.wait_for_function("window.hd24ReplyFeedback && typeof window.hd24ReplyFeedback.render==='function'",timeout=30000)

              # Reproduce the historical race: remove the upload panel, then render dedicated panels.
              page.evaluate("""() => {
                document.getElementById('hd24ReplyPanel')?.remove();
                window.hd24ReplyFeedback.render();
              }""")
              page.wait_for_function("document.getElementById('hd24ReplyAnalysisPanel') && document.getElementById('hd24ReplyMailPanel')",timeout=10000)

              page.evaluate("document.querySelector('.hd24-tab[data-tab=\"replyanalysis\"]')?.click()")
              page.wait_for_timeout(300)
              analysis=page.locator('#hd24ReplyAnalysisPanel').inner_text().strip()
              assert analysis, 'Reply analysis panel rendered completely blank'
              assert ('등록된 회신이 없습니다' in analysis or '회신 상세분석' in analysis or '회신 상세 분석' in analysis), analysis

              # Seed one reply and prove the data-backed analysis path renders.
              page.evaluate("""() => {
                localStorage.setItem('hd24_kpi_reply_history_v2', JSON.stringify([{
                  plant:'india',targetYear:2026,targetMonth:7,kpi:'샘플 KPI',kpiEn:'Sample KPI',
                  reason:'Missed target',rootCause:'Material delay from supplier',
                  recoveryPlan:'Daily recovery tracking and supplier escalation',
                  actionOwner:'Owner A',plannedCompletionDate:'2026-10-31',
                  nextMonthRecoveryTarget:'Recover to target',responder:'Plant',
                  replyReceivedAt:'2026-10-06T03:00:00Z',replySequence:1
                }]));
                window.hd24ReplyFeedback.render();
              }""")
              page.wait_for_timeout(300)
              analysis=page.locator('#hd24ReplyAnalysisPanel').inner_text()
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="total"] b').inner_text())==1, analysis
              # Re-check the executive dashboard reconciliation after rendering data.
              exec_cards=page.locator('#hd24ReplyAnalysisPanel .hd24-exec-drill')
              assert exec_cards.count() >= 4, 'Executive dashboard quality cards are missing'
              total_card=page.locator('.hd24-exec-drill[data-exec-drill="total"] b')
              complete_card=page.locator('.hd24-exec-drill[data-exec-drill="complete"] b')
              review_card=page.locator('.hd24-exec-drill[data-exec-drill="review"] b')
              attention_card=page.locator('.hd24-exec-drill[data-exec-drill="attention"] b')
              assert int(total_card.inner_text()) == int(complete_card.inner_text()) + int(review_card.inner_text()) + int(attention_card.inner_text())
              assert 'Executive Dashboard' in analysis, analysis
              # Executive quality buckets must reconcile exactly to the KPI population.
              cards=page.locator('#hd24ReplyAnalysisPanel .hd24-exec-drill')
              vals={}
              for i in range(cards.count()):
                  card=cards.nth(i)
                  raw=card.locator('b').inner_text().strip(); vals[card.get_attribute('data-exec-drill')]=0 if raw=='[최초 시행]' else int(raw.replace('건','').strip())
              assert vals.get('total')==vals.get('complete',0)+vals.get('review',0)+vals.get('attention',0), vals
              # Seed mixed quality rows and prove the severity tiers do not collapse into one bucket.
              page.evaluate("""localStorage.setItem('hd24_kpi_reply_history_v2', JSON.stringify([
                {plant:'india',targetYear:2026,targetMonth:8,kpiEn:'Tier Complete',reason:'Specific miss reason',rootCause:'Verified material shortage mechanism',recoveryPlan:'Secure supplier capacity and verify weekly recovery',actionOwner:'Owner A',plannedCompletionDate:'2026-10-31',replySequence:1},
                {plant:'india',targetYear:2026,targetMonth:8,kpiEn:'Tier Review',reason:'Specific miss reason',rootCause:'Verified material shortage mechanism',recoveryPlan:'Improve',actionOwner:'Owner B',plannedCompletionDate:'2026-10-31',replySequence:1},
                {plant:'india',targetYear:2026,targetMonth:8,kpiEn:'Tier Priority',reason:'Specific miss reason',rootCause:'',recoveryPlan:'',actionOwner:'',plannedCompletionDate:'',replySequence:1}
              ])); window.hd24ReplyFeedback.render()""")
              page.wait_for_timeout(300)
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="complete"] b').inner_text())==1
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="review"] b').inner_text())==1
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="attention"] b').inner_text())==1

              # Optional next-month recovery target must not downgrade an otherwise complete reply.
              page.evaluate("""localStorage.setItem('hd24_kpi_reply_history_v2', JSON.stringify([{plant:'india',targetYear:2026,targetMonth:8,kpiEn:'Optional Target Check',reason:'Specific miss reason',rootCause:'Verified material shortage mechanism',recoveryPlan:'Secure supplier capacity and verify weekly recovery',actionOwner:'Owner A',plannedCompletionDate:'2026-10-31',replySequence:1}])); window.hd24ReplyFeedback.render()""")
              page.wait_for_timeout(200)
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="complete"] b').inner_text())==1
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="review"] b').inner_text())==0
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="attention"] b').inner_text())==0
              assert '[최초 시행]' in page.locator('.hd24-exec-drill[data-exec-drill="history"] b').inner_text()
              assert '차월 회복목표 미기재' not in page.locator('#hd24ReplyAnalysisPanel').inner_text()
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="recurring"] b').inner_text())==0
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="stagnant"] b').inner_text())==0
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="retrospective"] b').inner_text())==0
              # Broad due timing must downgrade an otherwise complete first reply to review.
              page.evaluate("""localStorage.setItem('hd24_kpi_reply_history_v2', JSON.stringify([
                {plant:'india',targetYear:2026,targetMonth:8,kpiEn:'Broad Due Check',reason:'Demand fluctuation',rootCause:'Confirmed planning variance mechanism',recoveryPlan:'Rebalance plan and verify weekly performance',actionOwner:'Owner A',plannedCompletionDate:'Monthly',replySequence:1}
              ])); window.hd24ReplyFeedback.render()""")
              page.wait_for_timeout(200)
              broad_review=page.locator('.hd24-exec-drill[data-exec-drill="review"] b').inner_text()
              broad_complete=page.locator('.hd24-exec-drill[data-exec-drill="complete"] b').inner_text()
              broad_attention=page.locator('.hd24-exec-drill[data-exec-drill="attention"] b').inner_text()
              broad_text=page.locator('#hd24ReplyAnalysisPanel').inner_text()
              print('BROAD_DUE_DIAG', {'complete':broad_complete,'review':broad_review,'attention':broad_attention,'has_flag':'기한 구체화 필요' in broad_text})
              assert int(broad_review)==1, ('broad_due_review',broad_complete,broad_review,broad_attention)
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="overdue"] b').inner_text())==0, 'Monthly must never be classified as overdue'
              # Due-state regression matrix: week timing is actionable but not overdue; only explicit past dates without completed status are overdue.
              for due_value,status_value,expected_overdue in [('W1, Oct-2026','',0),('W2, Sep-2026','',0),('2020-01-01','',1),('2020-01-01','Complete',0)]:
                  page.evaluate("([due,status]) => { localStorage.setItem('hd24_kpi_reply_history_v2', JSON.stringify([{plant:'india',targetYear:2026,targetMonth:8,kpiEn:'Due State Check',reason:'Demand fluctuation',rootCause:'Confirmed planning variance mechanism',recoveryPlan:'Complete supplier recovery action and verify weekly performance',actionOwner:'Owner A',plannedCompletionDate:due,actionStatus:status,replySequence:1}])); window.hd24ReplyFeedback.render(); }", [due_value,status_value])
                  page.wait_for_timeout(100)
                  actual=int(page.locator('.hd24-exec-drill[data-exec-drill="overdue"] b').inner_text())
                  assert actual==expected_overdue, (due_value,status_value,expected_overdue,actual)

              # Detail rows are collapsed by default; tier value is the authoritative dashboard assertion here.

              # Prior-month KPI rows are trend history, not prior reply iterations.
              page.evaluate("""localStorage.setItem('hd24_kpi_reply_history_v2', JSON.stringify([
                {plant:'india',targetYear:2026,targetMonth:7,kpiEn:'Monthly History Check',reason:'Reason A',rootCause:'Root cause A verified',recoveryPlan:'Action A with weekly verification',actionOwner:'Owner A',plannedCompletionDate:'2026-10-31',replySequence:1},
                {plant:'india',targetYear:2026,targetMonth:8,kpiEn:'Monthly History Check',reason:'Reason A',rootCause:'Root cause A verified',recoveryPlan:'Action A with weekly verification',actionOwner:'Owner A',plannedCompletionDate:'2026-10-31',replySequence:1}
              ])); window.hd24ReplyFeedback.render()""")
              page.wait_for_timeout(200)
              assert '[최초 시행]' in page.locator('.hd24-exec-drill[data-exec-drill="history"] b').inner_text()
              # Monthly trend signals are independent from actual replySequence history.
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="recurring"] b').inner_text())>=1
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="stagnant"] b').inner_text())>=1
              assert int(page.locator('.hd24-exec-drill[data-exec-drill="retrospective"] b').inner_text())>=1



              for kind in ('total','complete','review','attention','recurring','stagnant','overdue','retrospective'):
                  card=page.locator(f'.hd24-exec-drill[data-exec-drill="{kind}"]')
                  expected=int(card.locator('b').inner_text())
                  card.click()
                  page.wait_for_selector('#hd24ExecDrillModal')
                  rows=page.locator('#hd24ExecDrillModal tbody tr')
                  actual=0 if expected==0 else rows.count()
                  assert actual==expected, (kind,expected,actual)
                  page.locator('#hd24ExecDrillClose').click()

              # Classification must be exhaustive and mutually exclusive.
              total=int(page.locator('.hd24-exec-drill[data-exec-drill="total"] b').inner_text())
              complete=int(page.locator('.hd24-exec-drill[data-exec-drill="complete"] b').inner_text())
              review=int(page.locator('.hd24-exec-drill[data-exec-drill="review"] b').inner_text())
              attention=int(page.locator('.hd24-exec-drill[data-exec-drill="attention"] b').inner_text())
              assert total==complete+review+attention, (total,complete,review,attention)

              page.evaluate("document.querySelector('.hd24-tab[data-tab=\"replymail\"]')?.click()")
              page.wait_for_timeout(300)
              mail=page.locator('#hd24ReplyMailPanel').inner_text().strip()
              assert mail, 'Reply feedback mail panel rendered completely blank'
              assert '회신 피드백 메일' in mail, mail
              assert page.locator('#hd24FeedbackSubject').count()==1
              assert page.locator('#hd24FeedbackDraft').count()==1
              draft=page.locator('#hd24FeedbackDraft').input_value()
              assert f'분석 KPI: {total}건' in draft, draft
              assert f'충분 {complete} / 보완 필요 {review} / 중점 보완 {attention}' in draft, draft
              recurring=int(page.locator('.hd24-exec-drill[data-exec-drill="recurring"] b').inner_text())
              stagnant=int(page.locator('.hd24-exec-drill[data-exec-drill="stagnant"] b').inner_text())
              overdue=int(page.locator('.hd24-exec-drill[data-exec-drill="overdue"] b').inner_text())
              retrospective=int(page.locator('.hd24-exec-drill[data-exec-drill="retrospective"] b').inner_text())
              assert f'전월 반복 근인 {recurring} / 전월 대책 정체 {stagnant} / 기한 초과 {overdue} / 회고 취약 {retrospective}건' in draft, draft
              if errors:
                  print('PAGEERRORS:', errors)
                  print('WINDOW_ERRORS:', page.evaluate("window.__hd24WindowErrors || []"))
              assert not errors, errors
              print('HD24 REPLY PANELS E2E PASS: empty-state + data-backed analysis + feedback mail')
              browser.close()
          PY
      - name: Preserve browser E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hd24-reply-e2e-failure-diagnostics
          path: |
            /tmp/hd24-reply-http.log
            test-results/
          if-no-files-found: warn
          retention-days: 7
