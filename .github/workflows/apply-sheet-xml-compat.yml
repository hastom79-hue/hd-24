name: Apply sheet XML compatibility
on:
  push:
    branches: [main]
    paths:
      - 'qa/patch_sheet_xml_path.py'
      - '.github/workflows/apply-sheet-xml-compat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index runtime
        run: python qa/patch_sheet_xml_path.py
      - name: Commit runtime patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: sheet XML relationship compatibility [skip ci]"
          git push
