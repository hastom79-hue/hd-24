name: Finalize safe reflect gate
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Gate reflect button on safeReady
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          old="document.getElementById('btnReflect').disabled = !(ok && needSrc);"
          new="document.getElementById('btnReflect').disabled = !(window.hd24SafeReflectReady && ok && needSrc);"
          if old not in s and new not in s: raise SystemExit('checkReady gate anchor not found')
          s=s.replace(old,new,1)
          idx.write_text(s,encoding='utf-8')

          safe=Path('safe-kpi-mapping.js')
          t=safe.read_text(encoding='utf-8')
          old2="window.hd24SafeReflectReady=true;btn.disabled=!(srcWorkbook&&masterWorkbook);btn.dataset.safeReflectReady='1';"
          new2="window.hd24SafeReflectReady=true;if(typeof checkReady==='function')checkReady();btn.dataset.safeReflectReady='1';"
          if old2 not in t and new2 not in t: raise SystemExit('safeReady install anchor not found')
          t=t.replace(old2,new2,1)
          safe.write_text(t,encoding='utf-8')
          PY
      - name: Assert fail-closed runtime path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          safe=Path('safe-kpi-mapping.js').read_text(encoding='utf-8')
          ui=Path('hd24-ui-v3.js').read_text(encoding='utf-8')
          assert "document.getElementById('btnReflect').addEventListener('click', async () => {" not in idx
          assert 'Legacy reflect path removed' in idx
          assert "window.hd24SafeReflectReady && ok && needSrc" in idx
          assert "window.hd24SafeReflectReady=true;if(typeof checkReady==='function')checkReady()" in safe
          assert 'safe-kpi-mapping.js?v=13' in ui
          assert 's.onerror=' in ui
          print('SAFE REFLECT FAIL-CLOSED FINAL ASSERTIONS PASS')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html safe-kpi-mapping.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: gate reflect button on safe guard readiness [skip ci]'
          git push origin HEAD:main