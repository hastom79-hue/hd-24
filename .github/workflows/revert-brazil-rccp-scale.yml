name: Revert Brazil RCCP scale to string-percent semantics
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore RCCP mapping for +8% string actuals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('mapping_brazil.json')
          d=json.loads(p.read_text())
          x=[x for x in d if x.get('kpiEn')=='M+1 Production Volume Variation Rate'][0]
          x['scale']=1
          x['valueFormat']='퍼센트텍스트'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=1)+'\n')
          y=[x for x in json.loads(p.read_text()) if x.get('kpiEn')=='M+1 Production Volume Variation Rate'][0]
          assert y['scale']==1 and y['valueFormat']=='퍼센트텍스트'
          print('RCCP STRING_PERCENT SEMANTICS PASS',y)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mapping_brazil.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore Brazil RCCP string percentage semantics [skip ci]'
          git push
