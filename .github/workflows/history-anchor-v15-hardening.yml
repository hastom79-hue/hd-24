name: HD24 v15 prior-month history anchor hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prior-month integrity anchor policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('safe-kpi-mapping.js')
          s=p.read_text(encoding='utf-8')
          old="function almostEqual(a,b){const x=Number(a),y=Number(b),diff=Math.abs(x-y);return diff<=ABS_EPS||diff<=REL_EPS*Math.max(1,Math.abs(x),Math.abs(y));}\nfunction numericCell(v){const n=normalizeValue(v);return n===null?null:n;}"
          new="""function almostEqual(a,b){const x=Number(a),y=Number(b),diff=Math.abs(x-y);return diff<=ABS_EPS||diff<=REL_EPS*Math.max(1,Math.abs(x),Math.abs(y));}\nfunction numericCell(v){const n=normalizeValue(v);return n===null?null:n;}\nfunction annotatedNumeric(v){if(typeof v!=='string')return null;const s=v.trim().replace(/,/g,'');if(s==='-')return 0;const m=s.match(/^([+-]?\\d+(?:\\.\\d+)?)/);return m?Number(m[1]):null;}\nfunction displayPrecisionEqual(expected,masterRaw){const direct=numericCell(masterRaw),mv=direct===null?annotatedNumeric(masterRaw):direct;if(mv===null)return false;if(almostEqual(expected,mv))return true;if(typeof masterRaw==='string'){if(masterRaw.trim()==='-'&&almostEqual(expected,0))return true;if(direct===null)return almostEqual(expected,mv);}if(typeof masterRaw!=='number')return false;const s=String(masterRaw);if(/[eE]/.test(s))return false;const dec=s.includes('.')?s.split('.')[1].replace(/0+$/,'').length:0,tol=0.5*Math.pow(10,-dec)+1e-9;return Math.abs(expected-mv)<=tol;}"""
          if old not in s: raise SystemExit('helper target not found')
          s=s.replace(old,new,1)
          old2="const patches={},historyMismatch=[];let currentWrites=0,backfills=0,blankPreserved=0,textPreserved=0,sameHistory=0;"
          new2="const patches={},historyMismatch=[],historyDrift=[];let currentWrites=0,backfills=0,blankPreserved=0,textPreserved=0,sameHistory=0,anchorChecked=0;"
          if old2 not in s: raise SystemExit('state target not found')
          s=s.replace(old2,new2,1)
          old3="const expected=nv*(m.scale||1),mcol=masterInfo.map[mo],ref=colLetter(mcol)+m.masterRow,cur=numericCell(getCell(masterWs,m.masterRow,mcol));if(mo<horizon&&cur!==null){if(almostEqual(cur,expected)){sameHistory++;continue;}historyMismatch.push(`${m.kpiKr} ${mo}월: 총괄 ${cur} / 원본 ${expected}`);continue;}if(Object.prototype.hasOwnProperty.call(patches,ref))"
          new3="const expected=nv*(m.scale||1),mcol=masterInfo.map[mo],ref=colLetter(mcol)+m.masterRow,masterRaw=getCell(masterWs,m.masterRow,mcol),cur=numericCell(masterRaw);if(mo<horizon&&masterRaw!=null&&String(masterRaw).trim()!==''){if(mo===horizon-1)anchorChecked++;if(displayPrecisionEqual(expected,masterRaw)){sameHistory++;continue;}const msg=`${m.kpiKr} ${mo}월: 총괄 ${masterRaw} / 원본 ${expected}`;if(mo===horizon-1)historyMismatch.push(msg);else historyDrift.push(msg);continue;}if(Object.prototype.hasOwnProperty.call(patches,ref))"
          if old3 not in s: raise SystemExit('history loop target not found')
          s=s.replace(old3,new3,1)
          old4="if(historyMismatch.length){log(`과거월 값 불일치 ${historyMismatch.length}건 — 안전을 위해 전체 반영 중단`);log(historyMismatch.slice(0,15).join(' | ')+(historyMismatch.length>15?' 외 '+(historyMismatch.length-15)+'건':''));throw new Error(`과거월 원천↔총괄 불일치 ${historyMismatch.length}건 감지. 총괄파일 생성 중단`);}\n log(`반영 사전검증: 당월 ${currentWrites}셀 / 과거 공란 백필 ${backfills}셀 / 과거 동일 ${sameHistory}셀 / 과거 불일치 보존 ${historyMismatch.length}셀 / 공란 보존 ${blankPreserved} / 비수치 보존 ${textPreserved}`);"
          new4="""if(historyMismatch.length){log(`직전월 무결성 불일치 ${historyMismatch.length}건 — 전체 반영 중단`);log(historyMismatch.slice(0,15).join(' | ')+(historyMismatch.length>15?' 외 '+(historyMismatch.length-15)+'건':''));throw new Error(`직전월 원천↔총괄 불일치 ${historyMismatch.length}건 감지. 총괄파일 생성 중단`);}\n if(historyDrift.length){log(`과거 개정/잔존값 차이 ${historyDrift.length}건 — 기존 총괄값 보존, 당월 반영 계속`);log(historyDrift.slice(0,15).join(' | ')+(historyDrift.length>15?' 외 '+(historyDrift.length-15)+'건':''));}\n log(`반영 사전검증: 당월 ${currentWrites}셀 / 과거 공란 백필 ${backfills}셀 / 직전월 앵커검증 ${anchorChecked}셀 / 과거 동일·표시동등 ${sameHistory}셀 / 과거 개정차이 보존 ${historyDrift.length}셀 / 공란 보존 ${blankPreserved} / 비수치 보존 ${textPreserved}`);"""
          if old4 not in s: raise SystemExit('history block target not found')
          s=s.replace(old4,new4,1)
          s=s.replace("과거 불일치 경고 ${historyMismatch.length}셀", "과거 개정차이 경고 ${historyDrift.length}셀")
          s=s.replace("과거경고 ${historyMismatch.length}건", "과거개정경고 ${historyDrift.length}건")
          s=s.replace('안전 실적 반영 v14 시작','안전 실적 반영 v15 시작').replace('안전 매핑 보호모드 v14 활성화','안전 매핑 보호모드 v15 활성화')
          p.write_text(s,encoding='utf-8')
          ui=Path('hd24-ui-v3.js'); u=ui.read_text(encoding='utf-8').replace('safe-kpi-mapping.js?v=14','safe-kpi-mapping.js?v=15'); ui.write_text(u,encoding='utf-8')
          idx=Path('index.html'); t=idx.read_text(encoding='utf-8').replace('hd24-ui-v3.js?v=14','hd24-ui-v3.js?v=15'); idx.write_text(t,encoding='utf-8')
          PY
      - name: Static and policy assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('safe-kpi-mapping.js').read_text(encoding='utf-8')
          assert 'function displayPrecisionEqual' in s
          assert 'mo===horizon-1' in s
          assert 'historyDrift.push(msg)' in s
          assert '직전월 원천↔총괄 불일치' in s
          assert '과거 개정/잔존값 차이' in s
          assert '안전 실적 반영 v15 시작' in s
          assert 'safe-kpi-mapping.js?v=15' in Path('hd24-ui-v3.js').read_text()
          assert 'hd24-ui-v3.js?v=15' in Path('index.html').read_text()
          print('V15 STATIC POLICY PASS')
          PY
          node - <<'NODE'
          function almostEqual(a,b){const x=Number(a),y=Number(b),diff=Math.abs(x-y);return diff<=1e-6||diff<=1e-6*Math.max(1,Math.abs(x),Math.abs(y));}
          function numericCell(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return v;if(typeof v==='string'){const s=v.trim();let m=s.match(/^([+-]?\d+(?:\.\d+)?)%$/);if(m)return parseFloat(m[1]);const n=Number(s.replace(/,/g,''));return Number.isFinite(n)?n:null;}return null;}
          function annotatedNumeric(v){if(typeof v!=='string')return null;const s=v.trim().replace(/,/g,'');if(s==='-')return 0;const m=s.match(/^([+-]?\d+(?:\.\d+)?)/);return m?Number(m[1]):null;}
          function displayPrecisionEqual(expected,masterRaw){const direct=numericCell(masterRaw),mv=direct===null?annotatedNumeric(masterRaw):direct;if(mv===null)return false;if(almostEqual(expected,mv))return true;if(typeof masterRaw==='string'){if(masterRaw.trim()==='-'&&almostEqual(expected,0))return true;if(direct===null)return almostEqual(expected,mv);}if(typeof masterRaw!=='number')return false;const s=String(masterRaw);if(/[eE]/.test(s))return false;const dec=s.includes('.')?s.split('.')[1].replace(/0+$/,'').length:0,tol=0.5*Math.pow(10,-dec)+1e-9;return Math.abs(expected-mv)<=tol;}
          const yes=[[3.19,3.2],[44.5,45],[0.045,0.05],[42,'42\n(누적)'],[0,'-'],[15.09,15.1]];
          const no=[[21,79],[269,286],[10,16],[1,2]];
          for(const x of yes)if(!displayPrecisionEqual(...x))throw new Error('expected semantic equal '+x);
          for(const x of no)if(displayPrecisionEqual(...x))throw new Error('expected mismatch '+x);
          console.log('V15 SEMANTIC HISTORY MATRIX PASS',yes.length+no.length);
          NODE
      - name: Commit v15
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add safe-kpi-mapping.js hd24-ui-v3.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: anchor history integrity on prior month and preserve older revisions [skip ci]'
          git push
