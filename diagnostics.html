<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HD-24 Runtime Diagnostics</title><style>body{font-family:Arial,"Malgun Gothic",sans-serif;margin:24px;background:#f6f7f9;color:#17212b}h1{font-size:22px}table{border-collapse:collapse;width:100%;max-width:900px;background:#fff}th,td{border:1px solid #d9dee5;padding:10px;text-align:left}.pass{color:#137333;font-weight:700}.fail{color:#b3261e;font-weight:700}.wait{color:#8a5a00}iframe{width:1px;height:1px;border:0;position:absolute;left:-9999px}</style></head><body><h1>HD-24 Runtime Diagnostics</h1><p>메인 페이지와 실행 의존성을 실제 브라우저 기준으로 점검합니다.</p><table><thead><tr><th>항목</th><th>결과</th><th>상세</th></tr></thead><tbody id="r"></tbody></table><iframe id="app"></iframe><script>
const rows=[];function add(n,ok,d){rows.push([n,ok,d]);render()}function render(){document.getElementById('r').innerHTML=rows.map(x=>`<tr><td>${x[0]}</td><td class="${x[1]===true?'pass':x[1]===false?'fail':'wait'}">${x[1]===true?'PASS':x[1]===false?'FAIL':'WAIT'}</td><td>${x[2]||''}</td></tr>`).join('')}
async function f(url){try{const r=await fetch(url,{cache:'no-store'});return {ok:r.ok,status:r.status,text:r.ok?await r.text():''}}catch(e){return {ok:false,status:0,text:'',err:String(e&&e.message||e)}}}
(async()=>{
 for(const [n,u] of [['CSS','./hd24-ui-v3.css?v=18'],['UI JS','./hd24-ui-v3.js?v=18'],['Safe runtime','./safe-kpi-mapping.js?v=18'],['India mapping','./mapping_india.json'],['Brazil mapping','./mapping_brazil.json']]){const x=await f(u);add(n,x.ok,`HTTP ${x.status||'-'}${x.err?' / '+x.err:''}`);if(n==='Safe runtime'&&x.ok){add('Safe: Brazil LTIR override',x.text.includes("LTIR (Lost Time Incident Rate)")&&x.text.includes("unit:'%'"),'production safe runtime token');add('Safe: India PPM exception',x.text.includes("name==='ppm'&&sf==='count'&&mf==='ppm'"),'Nos. → PPM');add('Safe: India 5S exception',x.text.includes("name==='5s audit score'&&sf==='pct'&&mf==='score'"),'% → score');add('Safe: future-month guard',x.text.includes('masterFutureContamination')&&x.text.includes('masterInfo.row+1'),'future contamination + header exclusion')}}
 const iframe=document.getElementById('app');let done=false;const timer=setTimeout(()=>{if(!done)add('Main app load',false,'10초 내 load 이벤트 없음')},10000);iframe.onload=()=>{done=true;clearTimeout(timer);try{const w=iframe.contentWindow,d=w.document;add('Main app load',true,d.title||'loaded');add('XLSX library',!!w.XLSX,w.XLSX?'global XLSX available':'cdnjs XLSX blocked/not loaded');add('JSZip library',!!w.JSZip,w.JSZip?'global JSZip available':'cdnjs JSZip blocked/not loaded');add('ExcelJS library',!!w.ExcelJS,w.ExcelJS?'global ExcelJS available':'cdnjs ExcelJS blocked/not loaded');add('Reflect button',!!d.getElementById('btnReflect'),'#btnReflect');setTimeout(()=>add('Safe readiness',w.hd24SafeReflectReady===true,String(w.hd24SafeReflectReady)),1200)}catch(e){add('Main app inspection',false,String(e&&e.message||e))}};iframe.src='./?diag='+Date.now();
})();
</script></body></html>
