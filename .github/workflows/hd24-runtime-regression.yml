name: HD24 Runtime Regression Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production runtime invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          index=Path('index.html').read_text(encoding='utf-8')
          ui=Path('hd24-ui-v3.js').read_text(encoding='utf-8')
          safe=Path('safe-kpi-mapping.js').read_text(encoding='utf-8')
          india=json.loads(Path('mapping_india.json').read_text(encoding='utf-8'))
          brazil=json.loads(Path('mapping_brazil.json').read_text(encoding='utf-8'))
          recovery=Path('.github/workflows/apply-approved-ui.yml').read_text(encoding='utf-8')

          # Cache/runtime chain must be internally consistent.
          m=re.search(r'safe-kpi-mapping\.js\?v=(\d+)',ui)
          assert m, 'safe runtime version missing from hd24-ui-v3.js'
          ver=m.group(1)
          assert f'hd24-ui-v3.js?v={ver}' in index, 'index/UI cache version mismatch'
          assert f'안전 실적 반영 v{ver} 시작' in safe, 'safe runtime banner/version mismatch'

          # Reflect path is fail-closed and has no legacy bubble handler.
          assert "document.getElementById('btnReflect').addEventListener('click'" not in index, 'legacy reflect click handler reintroduced'
          assert 'window.hd24SafeReflectReady && ok && needSrc' in index, 'reflect readiness gate missing'
          assert 'window.hd24SafeReflectReady=false' in ui, 'loader does not default fail-closed'
          assert 's.onerror=' in ui, 'safe loader onerror fail-closed path missing'
          assert "btn.addEventListener('click',safeReflect,true)" in safe, 'safe capture listener missing'
          assert 'window.hd24SafeReflectReady=true' in safe, 'safe readiness install missing'

          # Critical safety guards must remain present.
          required=[
              'KPI 전수검증 실패',
              '미래월 Actual',
              '직전월 원천↔총괄 불일치',
              'historyDrift.push(msg)',
              '수식 셀 반영 차단',
              '중복 KPI×월 대상 감지',
              '반영 후 셀 재검증 실패',
              '반영 건수 불일치',
              'displayPrecisionEqual',
              'validateUnit(srcWs,sr.row,m,masterWs,mr.row)',
          ]
          for token in required:
              assert token in safe, f'missing safety invariant: {token}'

          # XLSX sheet relationship lookup must remain producer-independent.
          assert 'new DOMParser()' in index, 'DOM-based workbook relationship parser missing'
          assert "getElementsByTagName('Relationship')" in index, 'relationship lookup is not attribute-order independent'
          assert "relation.getAttribute('Target')" in index, 'relationship target lookup missing'
          assert "if(!zip.file(path))" in index, 'resolved sheet XML existence gate missing'
          assert "Id=\"'+m[1]+'\"[^>]*Target" not in index, 'legacy attribute-order-dependent relationship regex reintroduced'

          # Current production mapping cardinality and uniqueness.
          assert len(india)==76, f'India static mapping changed unexpectedly: {len(india)}'
          assert len(brazil)==76, f'Brazil static mapping changed unexpectedly: {len(brazil)}'
          for plant,data in [('India',india),('Brazil',brazil)]:
              names=[x['kpiEn'].strip().lower() for x in data]
              rows=[x['masterRow'] for x in data]
              assert len(names)==len(set(names)), f'{plant} duplicate KPI mapping'
              assert len(rows)==len(set(rows)), f'{plant} duplicate masterRow mapping'

          # Known recovered Brazil mappings/semantics.
          nva=[x for x in brazil if x.get('kpiEn')=='NVA reduction cases reflecting from SWC']
          assert len(nva)==1 and nva[0]['labelRow']==150 and nva[0]['actualRow']==151 and nva[0]['masterRow']==122, 'Brazil NVA mapping regression'
          rccp=[x for x in brazil if x.get('kpiEn')=='M+1 Production Volume Variation Rate']
          assert len(rccp)==1 and rccp[0]['scale']==1 and rccp[0]['valueFormat']=='퍼센트텍스트', 'Brazil RCCP string-percent semantics regression'

          # Recovery workflow must derive active version, never hard-code old v3.
          stale_js='hd24-ui-v3.js?v='+'3'
          stale_css='hd24-ui-v3.css?v='+'3'
          assert stale_js not in recovery and stale_css not in recovery, 'stale v3 recovery path reintroduced'
          assert 'ver=m.group(1)' in recovery, 'dynamic recovery version extraction missing'

          print(f'HD24 RUNTIME REGRESSION PASS: runtime=v{ver}, India=76+1 runtime, Brazil=76+1 runtime, sheet-xml=DOM')
          PY
