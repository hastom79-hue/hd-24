name: HD24 Brazil Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'safe-kpi-mapping.js'
      - 'hd24-ui-v3.js'
      - 'mapping_brazil.json'
      - '.github/workflows/hd24-browser-e2e-brazil.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'safe-kpi-mapping.js'
      - 'hd24-ui-v3.js'
      - 'mapping_brazil.json'
      - '.github/workflows/hd24-browser-e2e-brazil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e-brazil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E2E dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Generate anonymous Brazil source/master fixtures from production mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openpyxl import Workbook, load_workbook

          root=Path('.')
          out=root/'qa'/'e2e-runtime-brazil'
          out.mkdir(parents=True,exist_ok=True)
          mapping=json.loads((root/'mapping_brazil.json').read_text(encoding='utf-8'))
          recovered='IQ 200 Issues with Production responsibility (Assembly)'
          if not any(str(m.get('kpiEn','')).strip().lower()==recovered.lower() for m in mapping):
              mapping.append({
                  'labelRow':62,'actualRow':63,
                  'kpiEn':recovered,
                  'direction':'하향','masterRow':34,
                  'kpiKr':'IQ200(생산귀책)',
                  'scale':1,'valueFormat':'숫자','unit':'DPTU'
              })

          months=['Jan-26','Feb-26','Mar-26','Apr-26','May-26','Jun-26','Jul-26','Aug-26','Sep-26','Oct-26','Nov-26','Dec-26']
          ltir='LTIR (Lost Time Incident Rate)'

          src=Workbook()
          sw=src.active
          sw.title='HCEB KPIs'
          for i,h in enumerate(months,start=18): sw.cell(11,i,h)
          for m in mapping:
              lr=int(m['labelRow']); ar=lr+1
              sw.cell(lr,6,m['kpiEn'])
              src_unit=m.get('unit') or ''
              if m.get('kpiEn')==ltir: src_unit='%'
              sw.cell(lr,10,src_unit)
              scale=float(m.get('scale') or 1)
              if m.get('valueFormat')=='퍼센트텍스트':
                  raw='+10%'
              else:
                  raw=10.0/scale
              for mo,c in enumerate(range(18,30),start=1):
                  if mo<=7: sw.cell(ar,c,raw)
          src.save(out/'brazil_source.xlsx')

          master=Workbook()
          mw=master.active
          mw.title='브라질법인 KPI(26년 보고용)'
          for i,h in enumerate(months,start=27): mw.cell(4,i,h)
          for m in mapping:
              r=int(m['masterRow'])
              mw.cell(r,13,m['kpiKr'])
              master_unit=m.get('unit') or ''
              if m.get('kpiEn')==ltir: master_unit='%'
              mw.cell(r,26,master_unit)
              for mo,c in enumerate(range(27,39),start=1):
                  if mo<=6: mw.cell(r,c,10.0)
          master.save(out/'master.xlsx')

          # Negative fixture: any numeric actual beyond July source horizon must fail closed.
          bad=load_workbook(out/'master.xlsx')
          bw=bad['브라질법인 KPI(26년 보고용)']
          first_row=min(int(m['masterRow']) for m in mapping)
          bw.cell(first_row,34,999.0)
          bad.save(out/'master_future_contaminated.xlsx')

          rows=sorted({int(m['masterRow']) for m in mapping})
          assert len(rows)==len(mapping), 'Synthetic Brazil fixture has duplicate master rows'
          assert any(m.get('kpiEn')==ltir for m in mapping), 'LTIR mapping missing from Brazil fixture'
          (out/'expected.json').write_text(json.dumps({
              'sheet':'브라질법인 KPI(26년 보고용)',
              'rows':rows,
              'expectedJuly':10.0,
              'mappingCount':len(mapping)
          },ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Brazil fixture mappings: {len(mapping)}')
          PY

      - name: Start local app server
        run: |
          python -m http.server 8766 --bind 127.0.0.1 > /tmp/hd24-http-brazil.log 2>&1 &
          echo $! > /tmp/hd24-http-brazil.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8766/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hd24-http-brazil.log
          exit 1

      - name: Brazil future-month block then clean reflect/download E2E
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          root=Path('.').resolve()
          fixture=root/'qa'/'e2e-runtime-brazil'
          download_dir=fixture/'downloads'
          download_dir.mkdir(exist_ok=True)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)

              # Negative case first.
              neg=browser.new_page(accept_downloads=True)
              neg_downloads=[]
              neg.on('download', lambda dl: neg_downloads.append(dl))
              neg.goto('http://127.0.0.1:8766/index.html', wait_until='networkidle', timeout=120000)
              neg.wait_for_function('window.hd24SafeReflectReady === true', timeout=30000)
              neg.locator('#plantSelect').select_option('brazil')
              neg.wait_for_function("document.getElementById('log').innerText.includes('브라질 매핑 로드: 76건')", timeout=30000)
              neg.locator('#srcFile').set_input_files(str(fixture/'brazil_source.xlsx'))
              neg.locator('#masterFile').set_input_files(str(fixture/'master_future_contaminated.xlsx'))
              neg.wait_for_function("!document.getElementById('btnReflect').disabled", timeout=30000)
              neg.locator('#btnReflect').click()
              neg.wait_for_function("document.getElementById('log').innerText.includes('오류:')", timeout=30000)
              neg_log=neg.locator('#log').inner_text()
              print('=== HD24 BRAZIL NEGATIVE LOG ===')
              print(neg_log)
              assert '미래월 Actual' in neg_log, 'Brazil future-month contamination did not fail closed'
              neg.wait_for_timeout(500)
              assert not neg_downloads, 'Brazil blocked future-month case unexpectedly downloaded a workbook'
              neg.close()

              # Clean positive case.
              page=browser.new_page(accept_downloads=True)
              console_errors=[]
              downloads=[]
              page.on('console', lambda msg: console_errors.append(msg.text) if msg.type=='error' else None)
              page.on('download', lambda dl: downloads.append(dl))
              page.goto('http://127.0.0.1:8766/index.html', wait_until='networkidle', timeout=120000)
              page.wait_for_function('window.hd24SafeReflectReady === true', timeout=30000)
              page.locator('#plantSelect').select_option('brazil')
              page.wait_for_function("document.getElementById('log').innerText.includes('브라질 매핑 로드: 76건')", timeout=30000)
              assert page.locator('#btnReflect').is_disabled(), 'Brazil reflect must stay disabled before files are loaded'

              page.locator('#srcFile').set_input_files(str(fixture/'brazil_source.xlsx'))
              page.locator('#masterFile').set_input_files(str(fixture/'master.xlsx'))
              page.wait_for_function("!document.getElementById('btnReflect').disabled", timeout=30000)
              assert page.locator('#btnReflect').get_attribute('data-safe-reflect-ready')=='1', 'Safe reflect readiness marker missing'

              page.locator('#btnReflect').click()
              page.wait_for_function("""() => {
                const t=document.getElementById('log').innerText;
                return t.includes('반영 후 재검증 PASS') || t.includes('오류:');
              }""", timeout=30000)
              log=page.locator('#log').inner_text()
              print('=== HD24 BRAZIL BROWSER LOG ===')
              print(log)
              print('=== END HD24 BRAZIL BROWSER LOG ===')
              if '오류:' in log and '반영 후 재검증 PASS' not in log:
                  raise AssertionError('HD24 Brazil reflect failed in browser:\n'+log)

              page.wait_for_timeout(1500)
              assert downloads, 'Brazil reflect reported PASS but no browser download event was emitted'
              dl=downloads[0]
              target=download_dir/dl.suggested_filename
              dl.save_as(str(target))
              assert '안전 실적 반영 v15 시작' in log
              assert '안전 매핑 검증: 77/77건' in log
              assert '반영 후 재검증 PASS: 77셀' in log
              assert '타 사업장 0셀' in log
              assert '미래월 0셀' in log
              assert '과거 기존값 덮어쓰기 0셀' in log
              assert '수식셀 덮어쓰기 0셀' in log
              assert target.exists() and target.stat().st_size>0
              bad=[x for x in console_errors if 'safe reflect guard failed' in x.lower() or 'safe mapping guard install failed' in x.lower()]
              assert not bad, bad
              (fixture/'download_path.txt').write_text(str(target),encoding='utf-8')
              print('Downloaded:',target)
              browser.close()
          PY

      - name: Verify downloaded Brazil workbook mutation boundaries
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          from openpyxl import load_workbook

          root=Path('qa/e2e-runtime-brazil')
          expected=json.loads((root/'expected.json').read_text(encoding='utf-8'))
          path=Path((root/'download_path.txt').read_text(encoding='utf-8').strip())
          wb=load_workbook(path,data_only=False)
          ws=wb[expected['sheet']]
          rows=expected['rows']
          exp=float(expected['expectedJuly'])
          bad=[]
          for r in rows:
              v=ws.cell(r,33).value
              if v is None or not math.isclose(float(v),exp,rel_tol=1e-9,abs_tol=1e-9):
                  bad.append((r,v))
              for c in range(34,39):
                  if ws.cell(r,c).value not in (None,''):
                      bad.append((r,c,ws.cell(r,c).value))
          if bad:
              raise SystemExit(f'Brazil E2E workbook verification failed: {bad[:20]}')
          print(f'BRAZIL BROWSER E2E PASS: July verified on {len(rows)} master rows; Aug-Dec untouched')
          PY
