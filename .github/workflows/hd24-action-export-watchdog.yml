name: HD24 Action Export Watchdog Regression
on:
  push:
    branches: [main]
    paths:
      - 'hd24-action-export-watchdog.js'
      - 'tests/action-export-watchdog.test.js'
      - '.github/workflows/hd24-action-export-watchdog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hd24-action-export-watchdog.js'
      - 'tests/action-export-watchdog.test.js'
      - '.github/workflows/hd24-action-export-watchdog.yml'
permissions:
  contents: read
jobs:
  watchdog-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and behavior regression
        run: |
          node --check hd24-action-export-watchdog.js
          node tests/action-export-watchdog.test.js
