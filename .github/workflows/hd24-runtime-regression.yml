name: HD24 Runtime Regression Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate production runtime invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          index=Path('index.html').read_text(encoding='utf-8')
          ui=Path('hd24-ui-v3.js').read_text(encoding='utf-8')
          core=Path('hd24-ui-v3-core.js').read_text(encoding='utf-8')
          safe=Path('safe-kpi-mapping.js').read_text(encoding='utf-8')
          refresh=Path('refresh-runtime.html').read_text(encoding='utf-8')
          india=json.loads(Path('mapping_india.json').read_text(encoding='utf-8'))
          brazil=json.loads(Path('mapping_brazil.json').read_text(encoding='utf-8'))

          outer_js=re.search(r'hd24-ui-v3\.js\?v=(\d+)',index)
          outer_css=re.search(r'hd24-ui-v3\.css\?v=(\d+)',index)
          safe_ver=re.search(r'safe-kpi-mapping\.js\?v=(\d+)',core)
          assert outer_js and outer_css and safe_ver, 'production cache-bust reference missing'
          assert f'hd24-ui-v3.js?v={outer_js.group(1)}' in refresh, 'refresh/UI JS cache version mismatch'
          assert f'hd24-ui-v3.css?v={outer_css.group(1)}' in refresh, 'refresh/UI CSS cache version mismatch'
          assert f'safe-kpi-mapping.js?v={safe_ver.group(1)}' in refresh, 'refresh/safe runtime cache version mismatch'

          for asset in ['hd24-ui-v3-core.js?v=18','hd24-auto-run.js?v=27','hd24-pipeline-gate.js?v=22','hd24-followup.js?v=29','hd24-direct-reply-guard.js?v=2','hd24-reply-import-dedupe.js?v=1','hd24-history-view.js?v=23']:
              assert asset in ui, f'production loader missing {asset}'
              assert asset in refresh or asset.startswith('hd24-ui-v3-core'), f'refresh preload missing {asset}'
          assert 'hd24-action-export.js' not in ui and 'hd24-followup-sync.js' not in ui, 'obsolete parallel action/follow-up runtime reintroduced'

          assert 'window.hd24SafeReflectReady=false' in core
          assert 's.onerror=' in core
          assert "btn.addEventListener('click',safeReflect,true)" in safe
          required=['KPI 전수검증 실패','미래월 Actual','직전월 원천↔총괄 불일치','historyDrift.push(msg)','수식 셀 반영 차단','중복 KPI×월 대상 감지','반영 후 셀 재검증 실패','반영 건수 불일치','displayPrecisionEqual','validateUnit(srcWs,sr.row,m,masterWs,mr.row)','masterFutureContamination']
          for token in required: assert token in safe, f'missing safety invariant: {token}'

          assert len(india)==76 and len(brazil)==76
          for plant,data in [('India',india),('Brazil',brazil)]:
              names=[x['kpiEn'].strip().lower() for x in data]; rows=[x['masterRow'] for x in data]
              assert len(names)==len(set(names)), f'{plant} duplicate KPI mapping'
              assert len(rows)==len(set(rows)), f'{plant} duplicate masterRow mapping'
          print(f'HD24 RUNTIME REGRESSION PASS: ui=v{outer_js.group(1)}, css=v{outer_css.group(1)}, safe=v{safe_ver.group(1)}, direct-reply-guard=v2')
          PY
          node --check hd24-auto-run.js
          node --check hd24-pipeline-gate.js
          node --check hd24-followup.js
          node --check hd24-direct-reply-guard.js
          node --check hd24-reply-import-dedupe.js
          node tests/auto-run-readiness.test.js
          node tests/reply-import-dedupe.test.js
          node tests/direct-reply-guard.test.js